[project]
name = "steam-market-pipeline"
version = "0.1.0"
description = "Streaming data platform over the Steam Community Market"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "aiokafka>=0.11",
    "pyarrow>=16.0",
    "boto3>=1.34",
    "duckdb>=1.5.5",
    "pyspark>=4.2.0",
    "pandas<3.0",
    "dbt-core>=1.12.3",
    "dbt-duckdb>=1.11.0",
    "great-expectations>=1.21.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["aiokafka.*", "boto3.*", "botocore.*", "pyarrow.*"]
ignore_missing_imports = true
