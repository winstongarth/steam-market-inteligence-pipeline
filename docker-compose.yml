services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    container_name: steam-redpanda
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr=internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr=internal://redpanda:8082,external://localhost:18082
    ports:
      - "19092:19092"
      - "18082:18082"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 5s
      timeout: 5s
      retries: 10

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.7.2
    container_name: steam-redpanda-console
    depends_on:
      - redpanda
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8080:8080"

  spark:
    image: apache/spark:4.2.0-python3
    container_name: steam-spark
    depends_on:
      - redpanda
      - minio
    environment:
      SPARK_KAFKA_BOOTSTRAP: redpanda:9092
      SPARK_S3_ENDPOINT: http://minio:9000
    volumes:
      - ./:/opt/app
    working_dir: /opt/app
    # Idle by default — Phase 2 dev/validation runs are `docker exec`'d in manually
    # (see docs/DECISIONS.md). A long-lived job would replace this command.
    # pandas is installed at container start (not baked into the base image) —
    # applyInPandasWithState (streaming/cdc_job.py) needs it on the driver.
    user: root
    entrypoint: ["bash", "-c", "pip install --quiet 'pandas>=2.2.0,<3.0' 'pyarrow>=18.0.0' && tail -f /dev/null"]

  webhook-receiver:
    image: apache/spark:4.2.0-python3
    container_name: steam-webhook-receiver
    volumes:
      - ./:/opt/project
    working_dir: /opt/project
    ports:
      - "9109:9109"
    entrypoint: ["python3", "-m", "quality.webhook_receiver"]

  minio:
    image: minio/minio:RELEASE.2024-08-17T01-24-54Z
    container_name: steam-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-airflow:
    image: postgres:16
    container_name: steam-postgres-airflow
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-airflow-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-init:
    image: apache/airflow:2.10.5-python3.11
    container_name: steam-airflow-init
    depends_on:
      postgres-airflow:
        condition: service_healthy
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      # PYTHONPATH, not in-DAG sys.path mutation: Airflow's task execution model doesn't
      # reliably preserve module-level (or even function-local) sys.path.insert() calls
      # into whatever process/thread actually runs a PythonOperator's callable (found
      # empirically — see docs/DECISIONS.md). Setting it at the interpreter/env level
      # sidesteps the question of exactly which Airflow internals would need chasing.
      PYTHONPATH: /opt/project
      ALERT_WEBHOOK_URL: http://webhook-receiver:9109/alert
      _PIP_ADDITIONAL_REQUIREMENTS: "dbt-core==1.12.3 dbt-duckdb==1.11.0 boto3 requests great-expectations"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./:/opt/project
    command: ["bash", "-c", "airflow db migrate && airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || true"]

  airflow-webserver:
    image: apache/airflow:2.10.5-python3.11
    container_name: steam-airflow-webserver
    depends_on:
      postgres-airflow:
        condition: service_healthy
    environment: *airflow-env
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./:/opt/project
    ports:
      - "8081:8080"
    command: webserver

  airflow-scheduler:
    image: apache/airflow:2.10.5-python3.11
    container_name: steam-airflow-scheduler
    depends_on:
      postgres-airflow:
        condition: service_healthy
    environment: *airflow-env
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./:/opt/project
    command: scheduler

volumes:
  redpanda-data:
  minio-data:
  postgres-airflow-data:
